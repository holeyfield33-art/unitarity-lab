[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unitarity-labs"
version = "3.2.1"
description = "Experimental multi-model runtime for transformer instrumentation, latent alignment tracing, distributed coordination"
readme = "README.md"
authors = [{name = "holeyfield33-art"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Upper bound on numpy only, no `==` pins: exact pins force pip to reinstall
# the scientific stack inside hosted notebooks (Colab, Kaggle), breaking the
# preinstalled torch that was compiled against the image's numpy.
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.26",
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "rich>=13.0",
    "safetensors>=0.4",
    # Reed-Solomon shards in core.chronos_lock. Pure-Python, no heavy
    # transitive deps. Core (not `dist`) because benchmarks.audit_suite —
    # the reproducibility claim — exercises ChronosLock in single-node mode,
    # so a base install must be able to run the full audit without extras.
    "reedsolo>=1.5",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dist = [
    "pyzmq>=25.0",
    "msgpack>=1.0",
]
# VAR, for unitarity_labs.core.passive_hook. Its import package is
# `var_spectral`; `var` on PyPI is an unrelated project.
#
# Previously declared as `var @ git+https://github.com/...`, which PyPI
# rejects on upload — so the published wheel silently carried no VAR
# dependency at all and `import unitarity_labs.core.passive_hook` failed
# after a plain `pip install unitarity-labs`.
spectral = [
    "var-spectral>=1.1.0",
]
# For benchmarks.real_gsm8k, which loads GSM8K via `datasets`.
bench = [
    "datasets>=2.14",
]
# Test/dev tooling. `nbformat` is required by scripts/validate_notebooks.py
# (and its test). Full test run: pip install -e ".[dist,spectral,bench,dev]"
# (or the `all` extra below). Without an extra, tests that need it skip.
dev = [
    "pytest>=7.0",
    "nbformat>=5.0",
]
# Everything, for a full local checkout that runs the entire test suite.
all = [
    "unitarity-labs[dist,spectral,bench,dev]",
]

[project.urls]
Homepage = "https://github.com/holeyfield33-art/unitarity-lab"
Repository = "https://github.com/holeyfield33-art/unitarity-lab.git"

[project.scripts]
unitarity-start = "unitarity_labs.cli:main"
unitarity-validate = "unitarity_labs.cli:validate_text_main"

[tool.setuptools.packages.find]
include = ["unitarity_labs", "unitarity_labs.*", "benchmarks", "benchmarks.*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
markers = [
    "geometric_brain: spectral rigidity and GUE attractor tests for the Geometric Brain module",
]
