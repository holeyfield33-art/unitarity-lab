name: Notebook Validation

'on':
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook tooling
        run: |
          python -m pip install --upgrade pip
          pip install nbformat pytest

      # The notebooks target Colab: their install cells pull from git and
      # download model weights, so executing them here would mostly test
      # GitHub's network. The suite logic they invoke runs for real in
      # benchmark-smoke.yml. What is checked here is that a notebook cannot
      # ship in a state that fails on contact — which is exactly how the old
      # starter notebook stayed green while emitting placeholder numbers.
      - name: Validate notebooks
        run: python scripts/validate_notebooks.py

      - name: Test the validator itself
        run: python -m pytest tests/test_validate_notebooks.py -q
