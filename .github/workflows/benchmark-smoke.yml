name: Benchmark Smoke Test

'on':
  pull_request:
  push:
    branches:
      - main

jobs:
  exp1-prompt-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers numpy scipy rich safetensors accelerate
          # VAR first so the `var-spectral` requirement is already satisfied.
          pip install "var-spectral @ git+https://github.com/holeyfield33-art/VAR@main"
          pip install -e '.[spectral,dist]'

      - name: Run exp1_prompt_separation (tiny CPU config)
        run: |
          python -m benchmarks.exp1_prompt_separation \
            --model gpt2 \
            --mode passive \
            --prompts-per-category 2 \
            --max-new-tokens 2 \
            --min-controls 1

      - name: Verify run artifacts were produced
        run: |
          run_dir=$(ls -d results/runs/*/ | tail -1)
          test -f "${run_dir}exp1_prompt_separation.json"
          test -f "${run_dir}manifest.json"
          echo "Verified run artifacts in ${run_dir}"

      # Exits non-zero if any check fails or errors, so a regression in the
      # metrics themselves breaks the build rather than being written to JSON
      # and ignored.
      - name: Run audit suite (tiny model, 2 repeats)
        run: |
          python -m benchmarks.audit_suite \
            --model-tier tiny \
            --repeat 2 \
            --output-dir audit_ci

      # A metric that changes between two identically-seeded runs in the same
      # process is not a number anyone can cite. Timings are exempt.
      - name: Assert non-timing metrics are reproducible
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("audit_ci/audit.json").read_text())
          unstable = [
              key for key in report["non_deterministic_metrics"]
              if not any(t in key for t in ("latency", "seconds", "duration"))
          ]
          if unstable:
              print("Non-timing metrics varied across repeats:", file=sys.stderr)
              for key in unstable:
                  print(f"  {key}", file=sys.stderr)
              sys.exit(1)
          print(f"All non-timing metrics reproducible "
                f"({report['counts']['pass']} checks passed).")
          PY
